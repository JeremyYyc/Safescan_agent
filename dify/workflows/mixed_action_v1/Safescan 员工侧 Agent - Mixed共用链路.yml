    - id: mx-plan-check
      type: custom
      data:
        title: MX-计划校验
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\n\ndef main(plan_json: str, extract_success: float, original: str) -> dict:\n    def\
          \ stop(message):\n        return {'decision': 'stop', 'message': message, 'plan': '{}'}\n    if extract_success\
          \ != 1:\n        return stop('请求拆分失败，未执行任何子任务。请补充完整问题后重试。')\n    try:\n        p = json.loads(plan_json)\n    except\
          \ (TypeError, ValueError):\n        return stop('请求计划格式无效，未执行任何子任务。')\n    if not isinstance(p, dict):\n       \
          \ return stop('请求计划格式无效，未执行任何子任务。')\n    keys = ['knowledge_query', 'record_query', 'action_query', 'dependency',\n\
          \            'condition_property', 'condition_id', 'condition_status']\n    if any(not isinstance(p.get(k), str)\
          \ for k in keys):\n        return stop('请求计划字段不完整，未执行任何子任务。')\n    p = {k: p[k].strip() for k in keys} | {'origin':\
          \ 'mixed'}\n    if sum(bool(p[k]) for k in keys[:3]) < 2:\n        return stop('无法拆成不同类型的子任务，请分别说明查询、咨询或操作需求。')\n\
          \    # The planner also supplies hard task counts; never silently discard extra tasks.\n    raw = json.loads(plan_json)\n\
          \    counts = raw.get('task_counts')\n    if not isinstance(counts, dict) or any(type(counts.get(k)) is not int\
          \ for k in ('knowledge','record','action')):\n        return stop('子任务数量不明确，请拆分后重试。')\n    if any(counts[k] != int(bool(p[k+'_query']))\
          \ for k in counts if k in ('knowledge','record','action')):\n        return stop('本版本每次最多一项知识咨询、一项记录查询和一项操作；未执行，请拆分。')\n\
          \    if raw.get('coverage') != 'complete':\n        return stop('请求含有无法完整保留的条件或任务，未执行，请拆分或补充说明。')\n    if p['dependency']\
          \ not in ('none','after_query','maintenance_status','manual'):\n        return stop('无法识别操作依赖条件，未执行任何子任务。')\n  \
          \  if p['dependency'] in ('after_query','maintenance_status') and not (p['record_query'] and p['action_query']):\n\
          \        return stop('操作依赖缺少前置查询，未执行任何子任务。')\n    if not p['action_query'] and p['dependency'] != 'none':\n    \
          \    return stop('请求的依赖关系不完整，未执行任何子任务。')\n    original_upper = original.upper()\n    # Prevent invented IDs in rewritten\
          \ sub-questions; arbitrary unknown IDs are retained and denied downstream.\n    for text in [p[k] for k in keys[:3]]:\n\
          \        for ref in re.findall(r'\\b[A-Z]{2,10}-\\d+(?:-\\d+)?\\b', text.upper()):\n            if ref not in original_upper:\n\
          \                return stop('拆分结果新增了原问题没有的对象编号，请明确目标后重试。')\n    for key in ('condition_property','condition_id'):\n\
          \        p[key] = p[key].upper()\n        if p[key] and p[key] not in original_upper:\n            return stop('条件目标未在原问题中明确提供，请补充目标编号。')\n\
          \    # A conservative backstop, not a general natural-language policy engine.\n    if p['action_query'] and p['dependency']\
          \ == 'none' and re.search(\n        r'如果|假如|只有|否则|符合.*(?:才|就)|依据.*(?:创建|提交|关闭)|\\b(if|unless|provided)\\b', original,\
          \ re.I\n    ):\n        p['dependency'] = 'manual'\n    if p['dependency'] == 'maintenance_status' and (\n     \
          \   not p['condition_property'] or p['condition_status'] not in ('open','in_progress','resolved','closed')\n   \
          \ ):\n        p['dependency'] = 'manual'\n    return {'decision':'allow','message':'计划有效。','plan':json.dumps(p,ensure_ascii=False)}\n"
        variables:
        - variable: plan_json
          value_selector:
          - mx-planner
          - plan_json
          value_type: string
        - variable: extract_success
          value_selector:
          - mx-planner
          - __is_success
          value_type: number
        - variable: original
          value_selector:
          - '1788353269350'
          - query
          value_type: string
        outputs:
          decision:
            type: string
            children: null
          message:
            type: string
            children: null
          plan:
            type: string
            children: null
      position:
        x: 1650
