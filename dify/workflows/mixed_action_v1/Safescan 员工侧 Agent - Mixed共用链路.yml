          全部租客\", \"所有租客\", \"BEN 管理\"]\n    if any(term in normalized_query for term in blocked_terms):\n        return {\n\
          \            \"is_authorized\": False,\n            \"safe_scope\": \"仅限当前员工被授权的房源范围。\",\n            \"requested_property\"\
          : requested_property,\n            \"authorization_message\": \"该请求试图绕过权限或访问敏感租客资料，因此已拒绝。\"\n        }\n\n    required_permission\
