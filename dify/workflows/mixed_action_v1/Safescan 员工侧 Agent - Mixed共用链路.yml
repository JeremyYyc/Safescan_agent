        - id: '2'
          label: lease_or_rent
          name: '查询具体合同、租期、到期日、续约状态、

            租金账单、付款、欠租记录或相关明细列表。


            例如：

            未来30天到期的合同有哪些？

            HV-102 的租金到账了吗？

            哪些租约存在逾期付款？


            要求返回合同或账单明细属于本类。

            只要求汇总数量、金额、比例或趋势，归 analytics。

            不包含员工工资、个人年假余额等人事查询。'
        - id: '1788354410675'
          label: maintenance
          name: '查询具体维修工单或工单列表：

            状态、进度、优先级、负责人、供应商和处理记录。


            例如：

            HV-102 的维修到哪一步了？

            有哪些尚未完成的高优先级维修？


            要求返回工单明细属于本类。

            只要求工单总数、比例或趋势，归 analytics。

            不处理维修规则解释或创建、修改、关闭工单。'
        - id: '1788354435210'
          label: inspection_or_video_report
          name: '查询实际人工检查记录、房况报告、视频分析报告，

            或对比指定房源的入住与退租报告。


            例如：

            HV-102 最近一次检查发现了什么？

            这套房的入住和退租报告有哪些差异？


            不处理一般检查流程解释或最终责任、扣款裁决。'
        - id: '1788354460599'
          label: analytics
          name: '查询运营汇总指标，如数量、总额、比例、趋势。


            例如：

            我管理的房源空置率是多少？

            目前共有多少高优先级维修工单？

            本月逾期租金合计多少？


            以汇总指标为主要结果，不要求逐项列出业务记录。

            如果要求具体房源、合同或工单列表，选择对应业务类别。'
        - id: '1788354473605'
          label: unsupported_record_query
          name: '属于合理的实际数据查询，但当前业务工具尚未覆盖。


            例如：

            我还剩多少天年假？

            我的工资什么时候到账？

            我的员工报销审批到哪一步了？


            不得将人事工资误判为租金账单。

            不得因为没有工具，就改成知识问题或认定用户违规。


            只有整个查询对象属于未支持领域时进入本类。

            房源查询包含尚不支持的通勤条件，仍属于 property，

            由后续处理说明缺少的筛选能力。'
