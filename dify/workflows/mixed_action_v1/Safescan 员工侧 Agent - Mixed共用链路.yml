    - data:
        code: "import json\n\n\ndef main(\n    staff_id: str,\n    metric: str,\n    scope: str\n) -> dict:\n    staff_profiles\
          \ = {\n        \"staff_amy\": {\n            \"role\": \"property_manager\",\n            \"managed_properties\"\
          : [\"HV-101\", \"HV-102\"],\n            \"permissions\": [\"analytics:read\"]\n        },\n        \"staff_ben\"\
          : {\n            \"role\": \"property_manager\",\n            \"managed_properties\": [\"PA-201\"],\n          \
          \  \"permissions\": [\"analytics:read\"]\n        },\n        \"staff_chloe\": {\n            \"role\": \"leasing_consultant\"\
          ,\n            \"managed_properties\": [\"HV-101\", \"PA-201\"],\n            \"permissions\": []\n        },\n\
          \        \"staff_david\": {\n            \"role\": \"operations_admin\",\n            \"managed_properties\": [],\n\
          \            \"permissions\": [\"analytics:read\", \"analytics:portfolio\"]\n        }\n    }\n\n    property_metrics\
          \ = {\n        \"HV-101\": {\n            \"occupancy_status\": \"occupied\",\n            \"monthly_rent_aud\"\
          : 3200,\n            \"lease_expiry\": \"2027-02-28\",\n            \"open_maintenance_count\": 0\n        },\n\
          \        \"HV-102\": {\n            \"occupancy_status\": \"vacant\",\n            \"monthly_rent_aud\": 0,\n  \
          \          \"lease_expiry\": None,\n            \"open_maintenance_count\": 1\n        },\n        \"PA-201\": {\n\
          \            \"occupancy_status\": \"occupied\",\n            \"monthly_rent_aud\": 3520,\n            \"lease_expiry\"\
          : \"2026-10-15\",\n            \"open_maintenance_count\": 1\n        }\n    }\n\n    profile = staff_profiles.get((staff_id\
          \ or \"\").strip())\n\n    if not profile:\n        result = {\n            \"tool\": \"get_portfolio_metrics\"\
          ,\n            \"status\": \"forbidden\",\n            \"message\": \"Unknown staff member.\"\n        }\n     \
          \   return {\n            \"tool_result\": json.dumps(result, ensure_ascii=False),\n            \"audit_id\": \"\
          mock-analytics-unknown-staff\"\n        }\n\n    if \"analytics:read\" not in profile[\"permissions\"]:\n      \
          \  result = {\n            \"tool\": \"get_portfolio_metrics\",\n            \"status\": \"forbidden\",\n      \
          \      \"message\": \"This staff member does not have analytics permission.\"\n        }\n        return {\n   \
          \         \"tool_result\": json.dumps(result, ensure_ascii=False),\n            \"audit_id\": \"mock-analytics-permission-denied\"\
          \n        }\n\n    requested_metric = (metric or \"\").strip().lower()\n    requested_scope = (scope or \"\").strip().lower()\n\
          \n    # operations_admin 可查询公司全局数据；物业经理只能查询自己名下物业。\n    is_company_scope = requested_scope in [\n        \"company\"\
          ,\n        \"portfolio\",\n        \"all\",\n        \"公司\",\n        \"全公司\",\n        \"全部\"\n    ]\n\n    if\
          \ is_company_scope and \"analytics:portfolio\" not in profile[\"permissions\"]:\n        result = {\n          \
          \  \"tool\": \"get_portfolio_metrics\",\n            \"status\": \"forbidden\",\n            \"message\": \"Company-wide\
          \ portfolio metrics are not authorized.\",\n            \"allowed_scope\": profile[\"managed_properties\"]\n   \
          \     }\n        return {\n            \"tool_result\": json.dumps(result, ensure_ascii=False),\n            \"\
          audit_id\": \"mock-analytics-scope-denied\"\n        }\n\n    if is_company_scope:\n        allowed_properties =\
          \ list(property_metrics.keys())\n        scope_label = \"company_portfolio\"\n    else:\n        allowed_properties\
          \ = profile[\"managed_properties\"]\n        scope_label = \"managed_properties\"\n\n    records = [\n        {\n\
          \            \"property_reference\": property_reference,\n            **property_metrics[property_reference]\n \
          \       }\n        for property_reference in allowed_properties\n        if property_reference in property_metrics\n\
          \    ]\n\n    total_properties = len(records)\n    occupied_count = sum(\n        1 for item in records\n      \
          \  if item[\"occupancy_status\"] == \"occupied\"\n    )\n    vacant_count = sum(\n        1 for item in records\n\
          \        if item[\"occupancy_status\"] == \"vacant\"\n    )\n    open_maintenance_count = sum(\n        item[\"\
          open_maintenance_count\"]\n        for item in records\n    )\n    monthly_rent_aud = sum(\n        item[\"monthly_rent_aud\"\
