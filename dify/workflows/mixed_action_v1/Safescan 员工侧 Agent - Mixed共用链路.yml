    - data:
        code: "import json\n\n\ndef main(staff_context: str, authorized_payload: str) -> dict:\n    def output(status, message,\
          \ draft=None):\n        return {\n            \"status\": status,\n            \"message\": message,\n         \
          \   \"tool_result\": json.dumps(\n                {\n                    \"status\": status,\n                 \
          \   \"message\": message,\n                    \"persisted\": False,\n                    \"executed\": False,\n\
          \                    \"approval_submitted\": False,\n                    \"draft\": draft or {}\n              \
          \  },\n                ensure_ascii=False\n            )\n        }\n\n    try:\n        staff = json.loads(staff_context)\n\
          \        payload = json.loads(authorized_payload)\n    except (TypeError, ValueError):\n        return output(\"\
          denied\", \"身份或操作参数无效，未生成草稿。\")\n\n    if not isinstance(staff, dict) or not isinstance(payload, dict):\n      \
          \  return output(\"denied\", \"身份或操作参数无效，未生成草稿。\")\n\n    permissions = staff.get(\"permissions\", [])\n    properties\
          \ = staff.get(\"managed_properties\", [])\n\n    if (\n        not isinstance(permissions, list)\n        or not\
          \ all(isinstance(x, str) for x in permissions)\n        or not isinstance(properties, list)\n        or not all(isinstance(x,\
          \ str) for x in properties)\n    ):\n        return output(\"denied\", \"权限配置无效，未生成草稿。\")\n\n    if (\n        not\
          \ staff.get(\"staff_id\")\n        or payload.get(\"staff_id\") != staff[\"staff_id\"]\n        or \"maintenance:draft\"\
          \ not in permissions\n    ):\n        return output(\"denied\", \"维修草稿操作权限校验未通过。\")\n\n    if payload.get(\"action\"\
          ) != \"create_draft\":\n        return output(\"denied\", \"此工具仅支持模拟生成维修草稿。\")\n\n    target = payload.get(\"property_reference\"\
          )\n    allowed = {x.strip().upper() for x in properties}\n\n    if not isinstance(target, str) or not target or\
          \ target not in allowed:\n        return output(\"denied\", \"目标房源范围校验未通过。\")\n\n    summary = payload.get(\"summary\"\
          )\n    priority = payload.get(\"priority\")\n\n    if (\n        not isinstance(summary, str)\n        or not summary.strip()\n\
          \        or priority not in {\"low\", \"medium\", \"high\", \"urgent\"}\n    ):\n        return output(\"invalid_request\"\
          , \"维修内容或优先级无效。\")\n\n    return output(\n        \"draft_simulated\",\n        \"已模拟生成维修草稿内容，未保存到业务系统，未提交审批或派单。\"\
          ,\n        {\n            \"property_reference\": target,\n            \"priority\": priority,\n            \"summary\"\
          : summary\n        }\n    )"
