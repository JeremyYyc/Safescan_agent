          \   \"permissions\": [\n                \"property:read\",\n                \"application:read\",\n            \
          \    \"inspection:read\"\n            ]\n        },\n        \"staff_david\": {\n            \"staff_name\": \"\
          David Liu\",\n            \"role\": \"operations_admin\",\n            \"managed_properties\": [],\n           \
          \ \"permissions\": [\n                \"portfolio_metrics:read\",\n                \"policy:read\",\n          \
          \      \"property:read_summary\"\n            ]\n        }\n    }\n\n    profile = staff_profiles.get(staff_id)\n\
