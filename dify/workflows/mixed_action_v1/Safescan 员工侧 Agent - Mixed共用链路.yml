    - data:
        code: "def main(staff_id: str, query: str, property_reference: str) -> dict:\n    staff_scopes = {\n        \"staff_amy\"\
          : {\n            \"role\": \"property_manager\",\n            \"properties\": [\"HV-101\", \"HV-102\"]\n       \
          \ },\n        \"staff_ben\": {\n            \"role\": \"property_manager\",\n            \"properties\": [\"PA-201\"\
          ]\n        },\n        \"staff_chloe\": {\n            \"role\": \"leasing_consultant\",\n            \"properties\"\
          : [\"HV-101\", \"PA-201\"]\n        },\n        \"staff_david\": {\n            \"role\": \"operations_admin\",\n\
          \            \"properties\": []\n        }\n    }\n\n    profile = staff_scopes.get(staff_id)\n    normalized_query\
          \ = (query or \"\").upper()\n    requested_property = (property_reference or \"\").strip().upper()\n\n    if not\
          \ profile:\n        return {\n            \"is_authorized\": False,\n            \"requested_property\": \"\",\n\
          \            \"safe_scope\": \"\",\n            \"authorization_message\": \"无效员工身份，无法访问房源数据。\"\n        }\n\n \
          \   blocked_terms = [\"忽略权限\", \"绕过权限\", \"所有员工\", \"全部租客\", \"BEN 管理\"]\n    if any(term in normalized_query for\
          \ term in blocked_terms):\n        return {\n            \"is_authorized\": False,\n            \"requested_property\"\
          : requested_property,\n            \"safe_scope\": \"仅限当前员工被授权的房源范围。\",\n            \"authorization_message\":\
          \ \"该请求试图访问未授权范围或绕过权限，因此已拒绝。\"\n        }\n\n    if profile[\"role\"] == \"operations_admin\":\n        return {\n\
          \            \"is_authorized\": False,\n            \"requested_property\": requested_property,\n            \"\
          safe_scope\": \"仅允许查看公司级运营汇总指标。\",\n            \"authorization_message\": \"运营管理员在当前原型中不具备单套房源详情的访问权限。\"\n    \
          \    }\n\n    allowed_properties = profile[\"properties\"]\n    safe_scope = \"、\".join(allowed_properties)\n\n\
          \    if not requested_property:\n        return {\n            \"is_authorized\": True,\n            \"requested_property\"\
          : \"\",\n            \"safe_scope\": safe_scope,\n            \"authorization_message\": \"允许查询当前员工负责范围内的房源。\"\n\
          \        }\n\n    if requested_property in allowed_properties:\n        return {\n            \"is_authorized\"\
          : True,\n            \"requested_property\": requested_property,\n            \"safe_scope\": safe_scope,\n    \
          \        \"authorization_message\": f\"允许访问房源 {requested_property}。\"\n        }\n\n    return {\n        \"is_authorized\"\
          : False,\n        \"requested_property\": requested_property,\n        \"safe_scope\": safe_scope,\n        \"authorization_message\"\
          : (\n            f\"拒绝访问房源 {requested_property}。\"\n            f\"当前员工仅可访问：{safe_scope}。\"\n        )\n    }"
