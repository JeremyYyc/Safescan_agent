    - id: mx-action-gate
      type: custom
      data:
        title: 操作前置条件校验
        type: code
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\n\ndef main(plan: str, record_result: str) -> dict:\n    p = json.loads(plan)\n    r\
          \ = json.loads(record_result)\n    def out(allow, status, message, bound=''):\n        return {'allow':allow, 'bound_property':bound,\n\
          \                'result':json.dumps({'kind':'action','status':status,'text':message,\n                        \
          \             'data':{},'executed':False},ensure_ascii=False)}\n    if not p['action_query']:\n        return out(False,'skipped','')\n\
          \    dep = p['dependency']\n    if dep == 'none':\n        return out(True,'pending','')\n    if dep == 'manual':\n\
          \        return out(False,'needs_review','操作条件需要人工确认；未创建草稿、修改记录或提交审批。')\n    if r['status'] != 'ok':\n        return\
          \ out(False,'dependency_failed','前置查询未成功或无匹配记录，依赖该查询的操作未执行。')\n    # Cross-task automatic dependency evaluation\
          \ is limited to exact maintenance records.\n    data = r.get('data',{})\n    if data.get('tool') != 'search_maintenance':\n\
          \        return out(False,'needs_review','当前仅支持根据维修工单原始状态自动判断操作条件；本次操作未执行。')\n    items = data.get('items',[])\n\
          \    if p['condition_id']:\n        items = [x for x in items if x.get('maintenance_id') == p['condition_id']]\n\
          \    if len(items) != 1 or not p['condition_property'] or items[0].get('property_reference') != p['condition_property']:\n\
          \        return out(False,'needs_input','前置结果未唯一定位到指定房源的工单，操作未执行。')\n    if dep == 'maintenance_status' and items[0].get('status')\
          \ != p['condition_status']:\n        return out(False,'condition_not_met','原始工单状态不满足指定条件，操作未执行。')\n    return out(True,'pending','',p['condition_property'])\n"
        variables:
        - variable: plan
          value_selector:
          - mx-context
          - plan
          value_type: string
        - variable: record_result
          value_selector:
          - mx-record-results
          - output
          value_type: string
        outputs:
          allow:
            type: boolean
            children: null
          bound_property:
            type: string
            children: null
          result:
            type: string
            children: null
