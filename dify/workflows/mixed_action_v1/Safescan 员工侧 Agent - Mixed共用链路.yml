    - data:
        desc: Extract Property Filters
        instruction: '你是物业运营系统的房源查询参数提取器。


          从员工问题中提取房源查询条件。


          规则：

          - 房源编号仅接受 HV-101、HV-102、PA-201；没有明确提及则为空。

          - “空置”“空房”标准化为 vacant。

          - “已出租”“在租”标准化为 leased。

          - “即将可入住”“即将空出”标准化为 available_soon。

          - 2B2B、两房、2 bedrooms 中的卧室数应标准化为数字 2。

          - 只提取用户明确表达的条件，不要猜测。

          覆盖前面编号白名单约束：用户明确给出的任意房源编号都必须原样保留，包括未知编号；不得清空后查询整个授权范围。'
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: qwen3.7-flash-2026-07-15
          provider: langgenius/tongyi/tongyi
        parameters:
        - description: 提取明确房源编号，如 HV-101、HV-102、PA-201；没有则为空。
          name: property_reference
          required: false
          type: string
        - description: 提取卧室数量。如“2B2B”“两房”“2 bedrooms”均提取 2；没有则为空。
          name: bedrooms
          required: false
