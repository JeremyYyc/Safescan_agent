    - data:
        code: "import json\n\n\ndef original_main(staff_context: str, action: str, property_reference: str, maintenance_id:\
          \ str, priority: str, summary: str, request_scope: str) -> dict:\n    def clean(value):\n        return value.strip()\
          \ if isinstance(value, str) else \"\"\n\n    def result(decision, reason, message, payload=None):\n        return\
          \ {\n            \"decision\": decision,\n            \"reason_code\": reason,\n            \"message\": message,\n\
          \            \"authorized_payload\": json.dumps(\n                payload or {}, ensure_ascii=False\n          \
          \  )\n        }\n\n    try:\n        staff = json.loads(staff_context)\n    except (TypeError, ValueError):\n  \
          \      staff = {}\n\n    if not isinstance(staff, dict) or not staff.get(\"staff_id\"):\n        return result(\n\
          \            \"deny\", \"INVALID_IDENTITY\",\n            \"无法验证员工身份。本次没有执行任何操作。\"\n        )\n\n    permissions\
          \ = staff.get(\"permissions\")\n    properties = staff.get(\"managed_properties\")\n\n    if (\n        not isinstance(permissions,\
          \ list)\n        or not all(isinstance(x, str) for x in permissions)\n        or not isinstance(properties, list)\n\
          \        or not all(isinstance(x, str) for x in properties)\n    ):\n        return result(\n            \"deny\"\
          , \"INVALID_AUTH_CONTEXT\",\n            \"员工权限配置无效。本次没有执行任何操作。\"\n        )\n\n    action = clean(action).lower()\n\
          \    target = clean(property_reference).upper()\n    priority = clean(priority).lower() or \"medium\"\n    summary\
          \ = clean(summary)\n    request_scope = clean(request_scope).lower()\n\n    if request_scope != \"single\":\n  \
          \      return result(\n            \"needs_input\", \"SINGLE_OPERATION_REQUIRED\",\n            \"本原型一次只处理一个目标的一项操作。\"\
          \n            \"请提供单个房源和明确的维修操作；本次尚未执行。\"\n        )\n\n    required_permissions = {\n        \"create_draft\":\
          \ \"maintenance:draft\",\n        \"update_record\": \"maintenance:update\",\n        \"close_record\": \"maintenance:close\"\
          ,\n        \"approve_request\": \"maintenance:approve\"\n    }\n\n    if action == \"unsupported\":\n        return\
          \ result(\n            \"unsupported\", \"ACTION_NOT_IMPLEMENTED\",\n            \"该维修操作尚未接入。本次没有执行任何变更。\"\n   \
          \     )\n\n    if action not in required_permissions:\n        return result(\n            \"needs_input\", \"UNKNOWN_ACTION\"\
          ,\n            \"无法确定具体维修操作，请明确要新建、修改、关闭还是审批。\"\n            \"本次尚未执行。\"\n        )\n\n    required = required_permissions[action]\n\
          \n    if required not in permissions:\n        return result(\n            \"deny\", \"MISSING_PERMISSION\",\n \
          \           \"你当前没有执行该维修操作的权限。\"\n            \"本次没有执行，也没有提交审批。\"\n        )\n\n    # 当前只实现草稿模拟；拥有其他权限也不能执行未接入的能力。\n\
          \    if action != \"create_draft\":\n        return result(\n            \"unsupported\", \"ACTION_NOT_IMPLEMENTED\"\
          ,\n            \"该操作的执行能力尚未接入。\"\n            \"本次没有修改工单，也没有提交审批。\"\n        )\n\n    if not target:\n        return\
          \ result(\n            \"needs_input\", \"MISSING_PROPERTY\",\n            \"请提供要报修的房源编号，例如 HV-102。本次尚未生成草稿。\"\n\
          \        )\n\n    allowed = {x.strip().upper() for x in properties}\n\n    if target not in allowed:\n        return\
          \ result(\n            \"deny\", \"OUT_OF_SCOPE\",\n            \"该目标不在你当前获授权的房源范围内。\"\n            \"本次没有生成草稿。\"\
          \n        )\n\n    if clean(maintenance_id):\n        return result(\n            \"needs_input\", \"AMBIGUOUS_TARGET\"\
          ,\n            \"请求包含已有工单编号，请明确是新建申请还是修改已有工单。\"\n            \"本次尚未执行。\"\n        )\n\n    if not summary:\n   \
          \     return result(\n            \"needs_input\", \"MISSING_SUMMARY\",\n            \"请补充需要维修的问题。本次尚未生成草稿。\"\n\
          \        )\n\n    if priority not in {\"low\", \"medium\", \"high\", \"urgent\"}:\n        return result(\n    \
          \        \"needs_input\", \"INVALID_PRIORITY\",\n            \"请明确优先级为低、普通、高或紧急。本次尚未生成草稿。\"\n        )\n\n    return\
          \ result(\n        \"allow\", \"AUTHORIZED\",\n        \"允许模拟生成维修申请草稿。\",\n        {\n            \"staff_id\":\
          \ staff[\"staff_id\"],\n            \"action\": action,\n            \"property_reference\": target,\n         \
          \   \"priority\": priority,\n            \"summary\": summary\n        }\n    )\n\ndef main(staff_context: str,\
          \ action: str, property_reference: str, maintenance_id: str,\n         priority: str, summary: str, request_scope:\
          \ str, bound_property: str, extract_success: float) -> dict:\n    if extract_success != 1:\n        return {\"decision\"\
          :\"needs_input\",\"reason_code\":\"EXTRACTION_FAILED\",\n                \"message\":\"操作参数提取失败，未执行操作。\",\"authorized_payload\"\
          :\"{}\"}\n    target=(property_reference or \"\").strip().upper()\n    if bound_property and target != bound_property:\n\
          \        return {\"decision\":\"deny\",\"reason_code\":\"DEPENDENCY_TARGET_MISMATCH\",\n                \"message\"\
          :\"操作目标与前置查询目标不一致，未执行操作。\",\"authorized_payload\":\"{}\"}\n    return original_main(staff_context, action, property_reference,\
          \ maintenance_id, priority, summary, request_scope)\n"
        code_language: python3
        desc: Maintenance Action Authorized
        outputs:
          authorized_payload:
            children: null
            type: string
          decision:
