[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "safescan-common"
version = "0.1.0"
description = "Stable cross-cutting infrastructure for SafeScan Python services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "PyJWT>=2.10,<3",
  "SQLAlchemy>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
