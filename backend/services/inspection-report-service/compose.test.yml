name: ${REPORT_COMPOSE_PROJECT_NAME:-safescan-report-p0-test}

x-report-env: &report-env
  DATABASE_URL: postgresql+psycopg://report:report-test-secret@postgres:5432/report_test
  INSPECTION_REPORT_DATABASE_URL: postgresql+psycopg://report:report-test-secret@postgres:5432/report_test
  AUTH_SECRET: report-test-auth-secret-that-is-long-enough
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: report-test-access
  MINIO_SECRET_KEY: report-test-secret
  MINIO_MEDIA_BUCKET: report-test-media
  MINIO_DERIVED_BUCKET: report-test-derived
  PROPERTY_LEASING_INTERNAL_URL: http://property-contract-fixture:8002
  REPORT_PIPELINE_VERSION: deterministic-test-adapter

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: report_test
      POSTGRES_USER: report
      POSTGRES_PASSWORD: report-test-secret
    ports:
      - "127.0.0.1:55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report -d report_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: report-test-access
      MINIO_ROOT_PASSWORD: report-test-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: safescan-inspection-report-p0:local
    environment: *report-env
    depends_on:
      minio:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import os
        from minio import Minio
        client = Minio(os.environ["MINIO_ENDPOINT"], access_key=os.environ["MINIO_ACCESS_KEY"], secret_key=os.environ["MINIO_SECRET_KEY"], secure=False)
        for bucket in (os.environ["MINIO_MEDIA_BUCKET"], os.environ["MINIO_DERIVED_BUCKET"]):
            if not client.bucket_exists(bucket): client.make_bucket(bucket)

  migrations:
    image: safescan-inspection-report-p0:local
    build:
      context: ../..
      dockerfile: services/inspection-report-service/Dockerfile
      target: runtime
    environment: *report-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "20260913_0009"]

  api:
    image: safescan-inspection-report-p0:local
    environment: *report-env
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:58004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30

  worker:
    image: safescan-inspection-report-p0:local
    environment: *report-env
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: ["python", "-m", "inspection_report_service.worker"]

  tests:
    image: safescan-inspection-report-p0-test:local
    build:
      context: ../..
      dockerfile: services/inspection-report-service/Dockerfile
      target: test
    environment:
      <<: *report-env
      REPORT_TEST_DATABASE_URL: postgresql+psycopg://report:report-test-secret@postgres:5432/report_test
      REPORT_TEST_MINIO_ENDPOINT: minio:9000
      REPORT_TEST_MINIO_ACCESS_KEY: report-test-access
      REPORT_TEST_MINIO_SECRET_KEY: report-test-secret
      REPORT_TEST_MINIO_MEDIA_BUCKET: report-test-media
      REPORT_TEST_MINIO_DERIVED_BUCKET: report-test-derived
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../../..:/workspace:ro
    working_dir: /workspace/backend/services/inspection-report-service
    command: ["pytest", "-q", "--strict-markers", "tests"]
