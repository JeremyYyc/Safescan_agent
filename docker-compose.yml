services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-safescan_agent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in root .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      PUBLIC_ID_SECRET: ${PUBLIC_ID_SECRET:?Set PUBLIC_ID_SECRET}
      AUTH_EXPIRE_HOURS: ${AUTH_EXPIRE_HOURS:-8}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ALIBABA_MODEL_L1: ${ALIBABA_MODEL_L1:-qwen-turbo-latest}
      ALIBABA_MODEL_L2: ${ALIBABA_MODEL_L2:-qwen-plus-latest}
      ALIBABA_MODEL_L3: ${ALIBABA_MODEL_L3:-qwen-max-latest}
      ALIBABA_MODEL_VL: ${ALIBABA_MODEL_VL:-qwen3-vl-plus}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OUTPUT_DIR: ${OUTPUT_DIR:-uploads}
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    depends_on:
      - backend

  gateway:
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    build:
      context: ./gateway
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  backend_uploads:
