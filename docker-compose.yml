x-skeleton-api: &skeleton-api
  build:
    context: ./infra/skeleton-api
  restart: unless-stopped
  networks: [application]
  healthcheck:
    test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['SERVICE_PORT']+'/health/ready', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 12

services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=${POSTGRES_TIMEZONE:-Asia/Shanghai}", "-c", "log_timezone=${POSTGRES_TIMEZONE:-Asia/Shanghai}"]
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safescan}
      POSTGRES_USER: ${POSTGRES_USER:-safescan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: ${POSTGRES_TIMEZONE:-Asia/Shanghai}
      PGTZ: ${POSTGRES_TIMEZONE:-Asia/Shanghai}
    volumes: [postgres17_p0_data:/var/lib/postgresql/data]
    networks: [database, database_host]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis_p0_data:/data]
    networks: [application]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes: [minio_p0_data:/data]
    networks: [storage]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrations:
    image: safescan-migrations:latest
    build:
      context: .
      dockerfile: infra/migrations/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
    networks: [database]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  identity-access-service:
    image: safescan-identity-access:latest
    build:
      context: ./backend
      dockerfile: services/identity-access-service/Dockerfile
    command:
      - sh
      - -c
      - >-
        if [ "$$IDENTITY_SEED_STAFF" = "true" ]; then python -m app.seed_staff;
        else python -m app.bootstrap_admin; fi &&
        uvicorn app.main:app --host 0.0.0.0 --port 8001
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-zh-CN}
      IDENTITY_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      IDENTITY_JWT_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-safescan-identity}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-safescan-api}
      IDENTITY_INTERNAL_AUDIENCE: ${IDENTITY_INTERNAL_AUDIENCE:-safescan-identity-internal}
      IDENTITY_ACCESS_TOKEN_SECONDS: ${IDENTITY_ACCESS_TOKEN_SECONDS:-900}
      IDENTITY_REFRESH_TOKEN_SECONDS: ${IDENTITY_REFRESH_TOKEN_SECONDS:-2592000}
      IDENTITY_SESSION_IDLE_SECONDS: ${IDENTITY_SESSION_IDLE_SECONDS:-604800}
      IDENTITY_ACTION_TOKEN_SECONDS: ${IDENTITY_ACTION_TOKEN_SECONDS:-3600}
      IDENTITY_REFRESH_COOKIE: ${IDENTITY_REFRESH_COOKIE:-safescan_refresh}
      IDENTITY_CSRF_COOKIE: ${IDENTITY_CSRF_COOKIE:-safescan_csrf}
      IDENTITY_COOKIE_DOMAIN: ${IDENTITY_COOKIE_DOMAIN:-}
      IDENTITY_DELETION_PEPPER: ${IDENTITY_DELETION_PEPPER:-}
      IDENTITY_DELETION_PEPPER_VERSION: ${IDENTITY_DELETION_PEPPER_VERSION:-1}
      IDENTITY_DELETION_PREVIOUS_PEPPERS: ${IDENTITY_DELETION_PREVIOUS_PEPPERS:-}
      IDENTITY_DELETION_DEPENDENCY_TIMEOUT_SECONDS: ${IDENTITY_DELETION_DEPENDENCY_TIMEOUT_SECONDS:-1.5}
      PROPERTY_LEASING_INTERNAL_URL: ${PROPERTY_LEASING_INTERNAL_URL:-http://property-leasing-service:8002}
      MAINTENANCE_INTERNAL_URL: ${MAINTENANCE_INTERNAL_URL:-http://maintenance-service:8003}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
      IDENTITY_EXPOSE_ACTION_TOKENS: ${IDENTITY_EXPOSE_ACTION_TOKENS:-false}
      IDENTITY_BOOTSTRAP_ADMIN_EMAIL: ${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:-}
      IDENTITY_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:-}
      IDENTITY_BOOTSTRAP_ADMIN_NAME: ${IDENTITY_BOOTSTRAP_ADMIN_NAME:-SafeScan Administrator}
      IDENTITY_BOOTSTRAP_ADMIN_STAFF_CODE: ${IDENTITY_BOOTSTRAP_ADMIN_STAFF_CODE:-ADMIN001}
      IDENTITY_SEED_STAFF: ${IDENTITY_SEED_STAFF:-false}
    networks: [application, database]
    depends_on:
      migrations: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24

  property-leasing-service:
    image: safescan-property-leasing:latest
    build:
      context: ./backend
      dockerfile: services/property-leasing-service/Dockerfile
    command:
      - sh
      - -c
      - >-
        if [ "$$PROPERTY_LEASING_SEED" = "true" ]; then python -m app.seed; fi &&
        uvicorn app.main:app --host 0.0.0.0 --port 8002
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROPERTY_LEASING_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PROPERTY_LEASING_JWT_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-safescan-identity}
      PROPERTY_LEASING_AUDIENCE: ${PROPERTY_LEASING_AUDIENCE:-property-leasing-service}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-http://identity-access-service:8001}
      IDENTITY_SERVICE_TOKEN: ${PROPERTY_LEASING_IDENTITY_SERVICE_TOKEN:-}
      PROPERTY_LEASING_SEED: ${PROPERTY_LEASING_SEED:-false}
      LEASING_CONSULTANT_STAFF_IDS: ${LEASING_CONSULTANT_STAFF_IDS:-}
      PROPERTY_MANAGER_STAFF_IDS: ${PROPERTY_MANAGER_STAFF_IDS:-}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      identity-access-service: {condition: service_healthy}
    networks: [application, database]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24

  property-leasing-worker:
    image: safescan-property-leasing:latest
    build:
      context: ./backend
      dockerfile: services/property-leasing-service/Dockerfile
    command: ["python", "-m", "app.lifecycle_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROPERTY_LEASING_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PROPERTY_LEASING_JWT_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-safescan-identity}
      LEASE_LIFECYCLE_POLL_SECONDS: ${LEASE_LIFECYCLE_POLL_SECONDS:-5}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
    depends_on:
      migrations: {condition: service_completed_successfully}
      property-leasing-service: {condition: service_healthy}
    networks: [application, database]
    restart: unless-stopped

  property-leasing-outbox-worker:
    image: safescan-property-leasing:latest
    build:
      context: ./backend
      dockerfile: services/property-leasing-service/Dockerfile
    command: ["python", "-m", "app.outbox_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROPERTY_LEASING_DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      PROPERTY_LEASING_JWT_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-safescan-identity}
      IDENTITY_BASE_URL: ${IDENTITY_BASE_URL:-http://identity-access-service:8001}
      IDENTITY_SERVICE_TOKEN: ${PROPERTY_LEASING_IDENTITY_SERVICE_TOKEN:-}
      PROPERTY_EVENT_SINK_URL: ${PROPERTY_EVENT_SINK_URL:-}
      PROPERTY_EVENT_SINK_TOKEN: ${PROPERTY_EVENT_SINK_TOKEN:-}
      PROPERTY_OUTBOX_POLL_SECONDS: ${PROPERTY_OUTBOX_POLL_SECONDS:-1}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
    depends_on:
      migrations: {condition: service_completed_successfully}
      property-leasing-service: {condition: service_healthy}
    networks: [application, database]
    restart: unless-stopped

  maintenance-service:
    <<: *skeleton-api
    image: safescan-maintenance:latest
    environment: {SERVICE_NAME: maintenance-service, SERVICE_PORT: "8003", REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"}
    depends_on: {migrations: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    networks: [application, database]

  inspection-report-service:
    <<: *skeleton-api
    image: safescan-inspection-report:latest
    environment: {SERVICE_NAME: inspection-report-service, SERVICE_PORT: "8004", REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/2"}
    depends_on: {migrations: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
    networks: [application, database, storage]

  inspection-report-worker:
    image: safescan-skeleton-worker:latest
    build: {context: ./infra/skeleton-worker}
    environment: {WORKER_NAME: inspection-report-worker, REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/2"}
    networks: [application, database, storage]
    depends_on:
      migrations: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      inspection-report-service: {condition: service_healthy}
    restart: unless-stopped

  staff-portal-api:
    image: safescan-staff-portal-api:latest
    build: {context: ./backend/services/staff-portal-api}
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8006"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/3"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-safescan-identity}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-safescan-api}
      PORTAL_SERVICE_TOKEN: ${STAFF_PORTAL_SERVICE_TOKEN:-${PORTAL_SERVICE_TOKEN:-}}
      IDENTITY_SERVICE_URL: http://identity-access-service:8001
      PROPERTY_LEASING_SERVICE_URL: http://property-leasing-service:8002
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8003
      INSPECTION_REPORT_SERVICE_URL: http://inspection-report-service:8004
      PORTAL_CONNECT_TIMEOUT_SECONDS: ${PORTAL_CONNECT_TIMEOUT_SECONDS:-0.3}
      PORTAL_REQUEST_TIMEOUT_SECONDS: ${PORTAL_REQUEST_TIMEOUT_SECONDS:-1.2}
      PORTAL_POOL_CONNECTIONS: ${PORTAL_POOL_CONNECTIONS:-50}
      PORTAL_POOL_KEEPALIVE: ${PORTAL_POOL_KEEPALIVE:-20}
    networks: [application]
    depends_on: {redis: {condition: service_healthy}, identity-access-service: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  tenant-portal-api:
    image: safescan-tenant-portal-api:latest
    build: {context: ./backend/services/tenant-portal-api}
    restart: unless-stopped
    environment:
      SERVICE_PORT: "8007"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/4"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_ISSUER: ${AUTH_ISSUER:-safescan-identity}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-safescan-api}
      PORTAL_SERVICE_TOKEN: ${TENANT_PORTAL_SERVICE_TOKEN:-${PORTAL_SERVICE_TOKEN:-}}
      IDENTITY_SERVICE_URL: http://identity-access-service:8001
      PROPERTY_LEASING_SERVICE_URL: http://property-leasing-service:8002
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8003
      INSPECTION_REPORT_SERVICE_URL: http://inspection-report-service:8004
      PORTAL_CONNECT_TIMEOUT_SECONDS: ${PORTAL_CONNECT_TIMEOUT_SECONDS:-0.3}
      PORTAL_REQUEST_TIMEOUT_SECONDS: ${PORTAL_REQUEST_TIMEOUT_SECONDS:-1.2}
      PORTAL_POOL_CONNECTIONS: ${PORTAL_POOL_CONNECTIONS:-50}
      PORTAL_POOL_KEEPALIVE: ${PORTAL_POOL_KEEPALIVE:-20}
    networks: [application]
    depends_on: {redis: {condition: service_healthy}, identity-access-service: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  staff-web:
    image: safescan-staff-web:latest
    build:
      context: ./frontend
      dockerfile: apps/portal-shell.Dockerfile
      args: {PORTAL_APP: staff-web, PORTAL_BASE: /staff/}
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  tenant-web:
    image: safescan-tenant-web:latest
    build:
      context: ./frontend
      dockerfile: apps/portal-shell.Dockerfile
      args: {PORTAL_APP: tenant-web, PORTAL_BASE: /tenant/}
    networks: [application]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  knowledge-service:
    <<: *skeleton-api
    image: safescan-knowledge:latest
    profiles: [future]
    environment: {SERVICE_NAME: knowledge-service, SERVICE_PORT: "8005"}

  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: [future]
    volumes: [qdrant_p0_data:/qdrant/storage]
    networks: [application]

  staff-agent-service:
    <<: *skeleton-api
    image: safescan-staff-agent:latest
    profiles: [agent]
    environment: {SERVICE_NAME: staff-agent-service, SERVICE_PORT: "8008"}

  tenant-agent-service:
    <<: *skeleton-api
    image: safescan-tenant-agent:latest
    profiles: [agent]
    environment: {SERVICE_NAME: tenant-agent-service, SERVICE_PORT: "8009"}

  gateway:
    image: safescan-gateway:latest
    build: {context: ./gateway}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
      - "127.0.0.1:${GATEWAY_S3_PORT:-9000}:9000"
      - "127.0.0.1:${GATEWAY_CONSOLE_PORT:-9001}:9001"
    environment:
      NGINX_IDENTITY_UPSTREAM: ${NGINX_IDENTITY_UPSTREAM:-identity-access-service:8001}
      NGINX_STAFF_BFF_UPSTREAM: ${NGINX_STAFF_BFF_UPSTREAM:-staff-portal-api:8006}
      NGINX_TENANT_BFF_UPSTREAM: ${NGINX_TENANT_BFF_UPSTREAM:-tenant-portal-api:8007}
      NGINX_STAFF_WEB_UPSTREAM: ${NGINX_STAFF_WEB_UPSTREAM:-staff-web:80}
      NGINX_TENANT_WEB_UPSTREAM: ${NGINX_TENANT_WEB_UPSTREAM:-tenant-web:80}
      NGINX_MINIO_S3_UPSTREAM: ${NGINX_MINIO_S3_UPSTREAM:-minio:9000}
      NGINX_MINIO_CONSOLE_UPSTREAM: ${NGINX_MINIO_CONSOLE_UPSTREAM:-minio:9001}
      NGINX_MAX_BODY_SIZE: ${MAX_UPLOAD_BYTES:-8589934592}
    networks: [application, storage]
    depends_on:
      staff-web: {condition: service_healthy}
      tenant-web: {condition: service_healthy}
      staff-portal-api: {condition: service_healthy}
      tenant-portal-api: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/gateway-health && wget -q --spider http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres17_p0_data:
  redis_p0_data:
  minio_p0_data:
  qdrant_p0_data:

networks:
  application:
  storage: {internal: true}
  database: {internal: true}
  # A dedicated bridge gives Docker Desktop a gateway for the loopback-only
  # PostgreSQL port without attaching application services to the DB host path.
  database_host:
