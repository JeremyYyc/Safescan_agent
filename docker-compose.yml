services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safescan}
      POSTGRES_USER: ${POSTGRES_USER:-safescan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      PUBLIC_ID_SECRET: ${PUBLIC_ID_SECRET:?Set PUBLIC_ID_SECRET}
      AUTH_EXPIRE_HOURS: ${AUTH_EXPIRE_HOURS:-8}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ALIBABA_MODEL_L1: ${ALIBABA_MODEL_L1:-qwen-turbo-latest}
      ALIBABA_MODEL_L2: ${ALIBABA_MODEL_L2:-qwen-plus-latest}
      ALIBABA_MODEL_L3: ${ALIBABA_MODEL_L3:-qwen-max-latest}
      ALIBABA_MODEL_VL: ${ALIBABA_MODEL_VL:-qwen3-vl-plus}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OUTPUT_DIR: ${OUTPUT_DIR:-uploads}
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    depends_on:
      - backend

  gateway:
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    build:
      context: ./gateway
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  backend_uploads:
