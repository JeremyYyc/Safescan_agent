services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    networks: [storage]
    volumes:
      - minio_data:/data
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safescan}
      POSTGRES_USER: ${POSTGRES_USER:-safescan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    networks: [database, database_host_access]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      UUID7_FORCE_FALLBACK: ${UUID7_FORCE_FALLBACK:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:-5}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW:-5}
      POSTGRES_POOL_TIMEOUT: ${POSTGRES_POOL_TIMEOUT:-10}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      PUBLIC_ID_SECRET: ${PUBLIC_ID_SECRET:?Set PUBLIC_ID_SECRET}
      AUTH_EXPIRE_HOURS: ${AUTH_EXPIRE_HOURS:-8}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      ALIBABA_MODEL_L1: ${ALIBABA_MODEL_L1:-qwen-turbo-latest}
      ALIBABA_MODEL_L2: ${ALIBABA_MODEL_L2:-qwen-plus-latest}
      ALIBABA_MODEL_L3: ${ALIBABA_MODEL_L3:-qwen-max-latest}
      ALIBABA_MODEL_VL: ${ALIBABA_MODEL_VL:-qwen3-vl-plus}
      AGENT_MAX_CONCURRENCY: ${AGENT_MAX_CONCURRENCY:-5}
      QWEN_CONNECT_TIMEOUT_SECONDS: ${QWEN_CONNECT_TIMEOUT_SECONDS:-10}
      QWEN_READ_TIMEOUT_SECONDS: ${QWEN_READ_TIMEOUT_SECONDS:-120}
      TOOL_MAX_ROUNDS: ${TOOL_MAX_ROUNDS:-4}
      TOOL_MAX_CALLS: ${TOOL_MAX_CALLS:-12}
      TOOL_MAX_OUTPUT_CHARS: ${TOOL_MAX_OUTPUT_CHARS:-64000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-gateway:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-safescan-media}
      MINIO_DERIVED_BUCKET: ${MINIO_DERIVED_BUCKET:-safescan-derived}
      MINIO_REPORTS_BUCKET: ${MINIO_REPORTS_BUCKET:-safescan-reports}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-268435456}
      UPLOAD_MAX_CONCURRENCY: ${UPLOAD_MAX_CONCURRENCY:-2}
      MAX_VIDEO_MEMORY_BYTES: ${MAX_VIDEO_MEMORY_BYTES:-268435456}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-600}
      MAX_VIDEO_PIXELS: ${MAX_VIDEO_PIXELS:-8294400}
      VIDEO_WORKER_CONCURRENCY: ${VIDEO_WORKER_CONCURRENCY:-2}
    build:
      context: ./backend
    networks: [application, database]
    depends_on:
      gateway:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    networks: [application]

  gateway:
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
      - "127.0.0.1:${GATEWAY_S3_PORT:-9000}:9000"
      - "127.0.0.1:${GATEWAY_CONSOLE_PORT:-9001}:9001"
    environment:
      NGINX_BACKEND_UPSTREAM: ${NGINX_BACKEND_UPSTREAM:-backend:8000}
      NGINX_FRONTEND_UPSTREAM: ${NGINX_FRONTEND_UPSTREAM:-frontend:80}
      NGINX_MINIO_S3_UPSTREAM: ${NGINX_MINIO_S3_UPSTREAM:-minio:9000}
      NGINX_MINIO_CONSOLE_UPSTREAM: ${NGINX_MINIO_CONSOLE_UPSTREAM:-minio:9001}
      NGINX_MAX_BODY_SIZE: ${MAX_UPLOAD_BYTES:-268435456}
    networks: [application, storage]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/gateway-health && wget -q --spider http://127.0.0.1:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
    build:
      context: ./gateway
    depends_on:
      - minio

volumes:
  # Major versions cannot reuse each other's physical data directory.
  postgres17_data:
  minio_data:

networks:
  application:
  storage:
    internal: true
  database:
    internal: true
  # Dedicated bridge required for Docker Desktop host port forwarding.
  # No application service joins this network; the published port stays loopback-only.
  database_host_access:
