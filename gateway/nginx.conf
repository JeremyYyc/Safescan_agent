user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No query strings: presigned S3 credentials may occur there.
    log_format gateway '$remote_addr $request_method $uri $server_port $status $request_time';
    access_log /var/log/nginx/access.log gateway;
    server_tokens off;
    sendfile on;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    include /etc/nginx/conf.d/*.conf;
}
# Built-in stream module. Empty until a TCP service is explicitly enabled.
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/stream.d/*.conf;
}
