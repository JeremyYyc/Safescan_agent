          \ profile[\"properties\"]\n    safe_scope = \"、\".join(allowed_properties)\n\
          \n    if not requested_property:\n        return {\n            \"is_authorized\"\
          : True,\n            \"requested_property\": \"\",\n            \"safe_scope\"\
          : safe_scope,\n            \"authorization_message\": \"允许查询当前员工负责范围内的房源。\"\
