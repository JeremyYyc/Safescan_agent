    - data:
        code: "import json\n\ndef main(\n    staff_id: str,\n    property_reference:\
          \ str,\n    bedrooms,\n    availability: str,\n    suburb: str\n) -> dict:\n\
          \    # 未来该权限范围应由后端基于 JWT/SSO 确定；\n    # 当前原型中由 Mock Tool 自行再次校验，模拟服务端二次授权。\n\
          \    staff_scopes = {\n        \"staff_amy\": [\"HV-101\", \"HV-102\"],\n\
          \        \"staff_ben\": [\"PA-201\"],\n        \"staff_chloe\": [\"HV-101\"\
          , \"PA-201\"],\n        \"staff_david\": []\n    }\n\n    properties = [\n\
          \        {\n            \"reference\": \"HV-101\",\n            \"address\"\
          : \"101 Harbour Street, Sydney NSW 2000\",\n            \"suburb\": \"Sydney\"\
          ,\n            \"bedrooms\": 2,\n            \"bathrooms\": 2,\n       \
          \     \"weekly_rent_aud\": 1250,\n            \"availability\": \"vacant\"\
          ,\n            \"facilities\": [\"parking\", \"gym\", \"supermarket_nearby\"\
          ]\n        },\n        {\n            \"reference\": \"HV-102\",\n     \
          \       \"address\": \"102 Harbour Street, Sydney NSW 2000\",\n        \
          \    \"suburb\": \"Sydney\",\n            \"bedrooms\": 3,\n           \
          \ \"bathrooms\": 2,\n            \"weekly_rent_aud\": 1680,\n          \
          \  \"availability\": \"leased\",\n            \"facilities\": [\"parking\"\
          , \"balcony\", \"supermarket_nearby\"]\n        },\n        {\n        \
          \    \"reference\": \"PA-201\",\n            \"address\": \"201 Church Street,\
          \ Parramatta NSW 2150\",\n            \"suburb\": \"Parramatta\",\n    \
          \        \"bedrooms\": 2,\n            \"bathrooms\": 1,\n            \"\
          weekly_rent_aud\": 880,\n            \"availability\": \"available_soon\"\
          ,\n            \"facilities\": [\"train_station_nearby\", \"supermarket_nearby\"\
          ]\n        }\n    ]\n\n    allowed_properties = staff_scopes.get(staff_id,\
          \ [])\n    normalized_reference = (property_reference or \"\").strip().upper()\n\
          \    normalized_availability = (availability or \"\").strip().lower()\n\
          \    normalized_suburb = (suburb or \"\").strip().lower()\n\n    if normalized_reference\
          \ and normalized_reference not in allowed_properties:\n        result =\
          \ {\n            \"status\": \"forbidden\",\n            \"message\": \"\
          Requested property is outside the authorized scope.\",\n            \"scope_summary\"\
          : \"、\".join(allowed_properties),\n            \"count\": 0,\n         \
          \   \"properties\": []\n        }\n        return {\n            \"tool_result\"\
          : json.dumps(result, ensure_ascii=False),\n            \"audit_id\": \"\
          mock-property-forbidden\"\n        }\n\n    filtered_properties = []\n\n\
          \    for property_item in properties:\n        # 工具层再次限制可见范围。\n        if\
          \ property_item[\"reference\"] not in allowed_properties:\n            continue\n\
          \n        if normalized_reference and property_item[\"reference\"] != normalized_reference:\n\
          \            continue\n\n        if bedrooms is not None and str(bedrooms).strip()\
          \ != \"\":\n            try:\n                if property_item[\"bedrooms\"\
          ] != int(float(bedrooms)):\n                    continue\n            except\
          \ (TypeError, ValueError):\n                pass\n\n        if normalized_availability\
          \ and property_item[\"availability\"] != normalized_availability:\n    \
          \        continue\n\n        if normalized_suburb and normalized_suburb\
          \ not in property_item[\"suburb\"].lower():\n            continue\n\n  \
          \      filtered_properties.append(property_item)\n\n    result = {\n   \
          \     \"status\": \"ok\",\n        \"scope_summary\": \"、\".join(allowed_properties),\n\
          \        \"count\": len(filtered_properties),\n        \"properties\": filtered_properties\n\
          \    }\n\n    return {\n        \"tool_result\": json.dumps(result, ensure_ascii=False),\n\
          \        \"audit_id\": \"mock-property-search-001\"\n    }"
