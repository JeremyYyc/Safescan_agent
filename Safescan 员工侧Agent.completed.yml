          \ term in blocked_terms):\n        return {\n            \"is_authorized\"\
          : False,\n            \"requested_property\": requested_property,\n    \
          \        \"safe_scope\": \"仅限当前员工被授权的房源范围。\",\n            \"authorization_message\"\
          : \"该请求试图访问未授权范围或绕过权限，因此已拒绝。\"\n        }\n\n    if profile[\"role\"] ==\
          \ \"operations_admin\":\n        return {\n            \"is_authorized\"\
          : False,\n            \"requested_property\": requested_property,\n    \
          \        \"safe_scope\": \"仅允许查看公司级运营汇总指标。\",\n            \"authorization_message\"\
