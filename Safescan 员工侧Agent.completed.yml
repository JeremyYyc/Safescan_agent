    - data:
        code: "import json\nfrom datetime import date\n\ndef main(\n    staff_id:\
          \ str,\n    property_reference: str,\n    due_within_days\n) -> dict:\n\
          \    staff_scopes = {\n        \"staff_amy\": [\"HV-101\", \"HV-102\"],\n\
          \        \"staff_ben\": [\"PA-201\"]\n    }\n\n    leases = [\n        {\n\
          \            \"lease_reference\": \"LEASE-HV102-01\",\n            \"property_reference\"\
          : \"HV-102\",\n            \"status\": \"active\",\n            \"lease_start_date\"\
          : \"2026-03-21\",\n            \"lease_end_date\": \"2026-09-20\",\n   \
          \         \"renewal_status\": \"not_contacted\"\n        },\n        {\n\
          \            \"lease_reference\": \"LEASE-PA201-01\",\n            \"property_reference\"\
          : \"PA-201\",\n            \"status\": \"active\",\n            \"lease_start_date\"\
          : \"2026-02-16\",\n            \"lease_end_date\": \"2027-02-15\",\n   \
          \         \"renewal_status\": \"not_due\"\n        }\n    ]\n\n    allowed_properties\
          \ = staff_scopes.get(staff_id, [])\n    requested_property = (property_reference\
          \ or \"\").strip().upper()\n\n    if requested_property and requested_property\
          \ not in allowed_properties:\n        result = {\n            \"status\"\
          : \"forbidden\",\n            \"message\": \"Requested property is outside\
          \ the authorized scope.\",\n            \"leases\": []\n        }\n    \
          \    return {\n            \"tool_result\": json.dumps(result, ensure_ascii=False),\n\
          \            \"audit_id\": \"mock-lease-forbidden\"\n        }\n\n    filtered_leases\
          \ = [\n        item for item in leases\n        if item[\"property_reference\"\
          ] in allowed_properties\n    ]\n\n    if requested_property:\n        filtered_leases\
          \ = [\n            item for item in filtered_leases\n            if item[\"\
          property_reference\"] == requested_property\n        ]\n\n    # 当前模拟日期：2026-09-02。\n\
          \    if due_within_days is not None and str(due_within_days).strip() !=\
          \ \"\":\n        try:\n            max_days = int(float(due_within_days))\n\
          \            today = date(2026, 9, 2)\n\n            filtered_leases = [\n\
          \                item for item in filtered_leases\n                if 0\
          \ <= (date.fromisoformat(item[\"lease_end_date\"]) - today).days <= max_days\n\
          \            ]\n        except (TypeError, ValueError):\n            pass\n\
          \n    result = {\n        \"status\": \"ok\",\n        \"scope_summary\"\
          : \"、\".join(allowed_properties),\n        \"count\": len(filtered_leases),\n\
          \        \"leases\": filtered_leases\n    }\n\n    return {\n        \"\
          tool_result\": json.dumps(result, ensure_ascii=False),\n        \"audit_id\"\
          : \"mock-list-leases-001\"\n    }"
