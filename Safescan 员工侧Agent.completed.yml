    - data:
        code: "def main(\n    staff_id: str,\n    query: str,\n    request_type: str,\n\
          \    property_reference: str\n) -> dict:\n    staff_profiles = {\n     \
          \   \"staff_amy\": {\n            \"role\": \"property_manager\",\n    \
          \        \"properties\": [\"HV-101\", \"HV-102\"],\n            \"permissions\"\
          : [\"lease:read\", \"rent:read\"]\n        },\n        \"staff_ben\": {\n\
          \            \"role\": \"property_manager\",\n            \"properties\"\
          : [\"PA-201\"],\n            \"permissions\": [\"lease:read\", \"rent:read\"\
          ]\n        },\n        \"staff_chloe\": {\n            \"role\": \"leasing_consultant\"\
          ,\n            \"properties\": [\"HV-101\", \"PA-201\"],\n            \"\
          permissions\": []\n        },\n        \"staff_david\": {\n            \"\
          role\": \"operations_admin\",\n            \"properties\": [],\n       \
          \     \"permissions\": []\n        }\n    }\n\n    profile = staff_profiles.get(staff_id)\n\
          \    normalized_query = (query or \"\").upper()\n    normalized_request_type\
          \ = (request_type or \"\").strip().lower()\n    requested_property = (property_reference\
          \ or \"\").strip().upper()\n\n    if not profile:\n        return {\n  \
          \          \"is_authorized\": False,\n            \"safe_scope\": \"\",\n\
          \            \"requested_property\": requested_property,\n            \"\
          authorization_message\": \"无效员工身份，无法访问合同或租金数据。\"\n        }\n\n    blocked_terms\
          \ = [\"忽略权限\", \"绕过权限\", \"全部租客\", \"所有租客\", \"BEN 管理\"]\n    if any(term\
          \ in normalized_query for term in blocked_terms):\n        return {\n  \
          \          \"is_authorized\": False,\n            \"safe_scope\": \"仅限当前员工被授权的房源范围。\"\
          ,\n            \"requested_property\": requested_property,\n           \
          \ \"authorization_message\": \"该请求试图绕过权限或访问敏感租客资料，因此已拒绝。\"\n        }\n\n\
          \    required_permission = (\n        \"lease:read\" if normalized_request_type\
          \ == \"lease\" else \"rent:read\"\n    )\n\n    if required_permission not\
          \ in profile[\"permissions\"]:\n        return {\n            \"is_authorized\"\
          : False,\n            \"safe_scope\": \"无合同或租金明细访问范围。\",\n            \"\
          requested_property\": requested_property,\n            \"authorization_message\"\
          : (\n                \"当前员工角色不具备合同或租金明细的读取权限。\"\n            )\n       \
          \ }\n\n    allowed_properties = profile[\"properties\"]\n    safe_scope\
          \ = \"、\".join(allowed_properties)\n\n    if requested_property and requested_property\
          \ not in allowed_properties:\n        return {\n            \"is_authorized\"\
          : False,\n            \"safe_scope\": safe_scope,\n            \"requested_property\"\
          : requested_property,\n            \"authorization_message\": (\n      \
          \          f\"房源 {requested_property} 不在你的管理范围内。\"\n            )\n    \
          \    }\n\n    return {\n        \"is_authorized\": True,\n        \"safe_scope\"\
          : safe_scope,\n        \"requested_property\": requested_property,\n   \
          \     \"authorization_message\": (\n            f\"允许在授权范围内查询 {normalized_request_type\
          \ or 'lease'} 数据。\"\n        )\n    }"
