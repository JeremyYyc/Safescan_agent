            ,\n            \"role\": \"property_manager\",\n            \"managed_properties\"\
            : [\"HV-101\", \"HV-102\"],\n            \"permissions\": [\n        \
            \        \"property:read\",\n                \"lease:read\",\n       \
            \         \"rent:read\",\n                \"maintenance:read\",\n    \
            \            \"maintenance:draft\",\n                \"inspection:read\"\
            ,\n                \"condition_report:read\"\n            ]\n        },\n\
            \        \"staff_ben\": {\n            \"staff_name\": \"Ben Li\",\n \
            \           \"role\": \"property_manager\",\n            \"managed_properties\"\
            : [\"PA-201\"],\n            \"permissions\": [\n                \"property:read\"\
            ,\n                \"lease:read\",\n                \"rent:read\",\n \
            \               \"maintenance:read\",\n                \"maintenance:draft\"\
            ,\n                \"inspection:read\",\n                \"condition_report:read\"\
            \n            ]\n        },\n        \"staff_chloe\": {\n            \"\
            staff_name\": \"Chloe Wang\",\n            \"role\": \"leasing_consultant\"\
            ,\n            \"managed_properties\": [\"HV-101\", \"PA-201\"],\n   \
            \         \"permissions\": [\n                \"property:read\",\n   \
            \             \"application:read\",\n                \"inspection:read\"\
            \n            ]\n        },\n        \"staff_david\": {\n            \"\
            staff_name\": \"David Liu\",\n            \"role\": \"operations_admin\"\
            ,\n            \"managed_properties\": [],\n            \"permissions\"\
            : [\n                \"portfolio_metrics:read\",\n                \"policy:read\"\
            ,\n                \"property:read_summary\"\n            ]\n        }\n\
            \    }\n\n    profile = staff_profiles.get(staff_id)\n\n    if not profile:\n\
