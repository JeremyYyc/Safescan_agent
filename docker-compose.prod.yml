services:
  db:
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-safescan_agent}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in production}
    restart: unless-stopped

  backend:
    env_file:
      - ./.env.production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Use gateway entry by default; avoid trailing slash to prevent //api paths.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080}
    restart: unless-stopped

  gateway:
    ports:
      - "8080:80"
    restart: unless-stopped
